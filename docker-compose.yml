services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobvault
      POSTGRES_PASSWORD: jobvault
      POSTGRES_DB: jobvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://jobvault:jobvault@db:5432/jobvault
      # Supplied from the environment, never hardcoded. Refuses to start if unset.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required; generate with python -c "import secrets; print(secrets.token_urlsafe(48))"}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
