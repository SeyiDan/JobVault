name: ci

on:
  push:
    branches: [master, main, "security/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-secret-not-a-real-key-0123456789abcdef
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  backend-postgres:
    # The same suite against real Postgres with pgvector. SQLite cannot exercise
    # app/rag/store.py's pgvector branch, and untested production-only code is
    # the code most likely to be broken.
    name: pytest (postgres + pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobvault
          POSTGRES_PASSWORD: jobvault
          POSTGRES_DB: jobvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-not-a-real-key-0123456789abcdef
      DATABASE_URL: "postgresql+asyncpg://jobvault:jobvault@localhost:5432/jobvault_test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  extension:
    name: node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"
      - run: node --test test/escape.test.js
